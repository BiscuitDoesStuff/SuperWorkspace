name: sw-validate
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  validate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workspace contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .sw/sw.ps1 validate
      - name: Whitespace
        shell: bash
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD -- .sw .agents .claude .codex AGENTS.md t3.json
